name: Deploy Mimi Pet Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # DEBUG TẠM THỜI: in giá trị vars.API_BASE_URL ra log Actions để xác
      # nhận GitHub có thật sự truyền đúng biến vào build hay không (an toàn
      # in ra vì đây là URL backend công khai, không phải bí mật) - xoá bước
      # này sau khi xác nhận build đã đúng URL.
      - run: echo "API_BASE_URL hiện tại là:'${{ vars.API_BASE_URL }}'"

      # API_BASE_URL là 1 repository VARIABLE (không phải secret - URL
      # backend Render không phải thông tin bí mật), khai tại Settings ->
      # Secrets and variables -> Actions -> tab Variables. Xem
      # `deployment.md` Phần 2 Bước 2.3 để biết cách tạo/lấy giá trị này.
      # --base-href PHẢI khớp đúng tên repo GitHub thật (repo này tên
      # "mimi_pet_BE", KHÔNG phải "mimi_pet") - GitHub Pages phục vụ project
      # site tại https://<user>.github.io/<ten-repo>/, sai tên repo ở đây
      # khiến mọi asset (JS/CSS/main.dart.js...) load 404 dù trang HTML gốc
      # vẫn mở được.
      - run: >
          flutter build web --release
          --base-href /mimi_pet_BE/
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
